name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-js-rejected:
    name: Verify JS backend rejected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | bash -s -- -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Verify JS backend fails with clear error
        run: |
          output=$(nim js --path:src -c tests/test_softlink.nim 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "JavaScript backend does not support"

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: macos-latest
            cc: clang
          - os: windows-latest
            cc: gcc
            name: windows-mingw
          - os: windows-latest
            cc: vcc
            name: windows-msvc
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.name || matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: matrix.cc == 'vcc'
        uses: ilammy/msvc-dev-cmd@v1

      # Install Nim AFTER MSVC setup so PATH isn't clobbered
      - name: Install Nim (POSIX)
        if: runner.os != 'Windows'
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | bash -s -- -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Nim (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L https://nim-lang.org/download/nim-2.2.0_x64.zip -o nim.zip
          unzip -q nim.zip
          echo "$PWD/nim-2.2.0/bin" >> "$GITHUB_PATH"

      # Fixtures mirror the nimble `test` task: testlib (explicit-pattern block),
      # libmagic (bare logical name "magic"), and libvern.so.3 (Linux runtime-only
      # versioned soname). Without these the dynlib "magic"/"vern" tests fail.
      - name: Build test library (MSVC)
        if: matrix.cc == 'vcc'
        shell: cmd
        run: |
          cl /LD /DTESTLIB_BUILDING /Fe:tests\testlib.dll tests\testlib.c
          cl /LD /DTESTLIB_BUILDING /Fe:tests\libmagic.dll tests\testlib.c

      # /std:clatest opens the C23 gate so MSVC exposes _Generic/__typeof__;
      # -d:softlinkStrictVerify turns a would-be-skipped verify block into a hard
      # #error, so this leg cannot go green unless the real check actually compiled.
      - name: Run tests (MSVC)
        if: matrix.cc == 'vcc'
        shell: cmd
        run: |
          set PATH=%CD%\tests;%CD%\nim-2.2.0\bin;%PATH%
          nim c -r --cc:vcc --path:src --passC:/I. --passC:/std:clatest -d:softlinkStrictVerify tests\test_softlink.nim

      # RFC-0001 slice A9: the portable, exit-code-only A4 checks (dynlib +
      # verifyProcs prototype-conflict fixtures, C and C++ backends) via the
      # dedicated `testMsvcExitCodes` nimble task -- see that task's doc
      # comment in softlink.nimble for why the MSVC leg gets this narrower
      # task instead of the full `test` task (which is gcc-only by
      # construction: it always builds fixtures with gcc and never passes
      # `--cc:vcc`). No separate library build needed: these fixtures are
      # compile-only, no runtime dlsym dispatch.
      - name: Run RFC-0001 A9 MSVC exit-code checks
        if: matrix.cc == 'vcc'
        shell: cmd
        run: |
          nimble testMsvcExitCodes -y

      # RFC-0001 slice A9: previously this leg ran `nim c -r`/`nim cpp -r`
      # directly and never invoked the nimble `test` task, so every tfail_*/
      # thint_*/tcheck_* grep and exit-code check in softlink.nimble was
      # CI-unenforced -- only the suite's runtime unittests ran here. `nimble
      # test` builds the same fixture libraries (testlib/libmagic/libvern)
      # this step used to build by hand and additionally runs both backends
      # plus every negative-compile/hint check. Not run for MSVC (matrix.cc
      # == 'vcc'): the nimble task's windows branch is gcc-only (see above).
      - name: Run tests (nimble test)
        if: matrix.cc != 'vcc'
        shell: bash
        run: nimble test -y
